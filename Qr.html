<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Point Coffee - Permanen</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background-color: #f4f6f8;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h2 {
      margin: 0 0 8px 0;
      color: #00703c;
      font-size: 20px;
    }
    p {
      margin: 0 0 20px 0;
      color: #555;
      font-size: 13px;
    }
    /* Canvas hasil akhir yang siap di-download */
    #finalCanvas {
      width: 100%;
      max-width: 300px;
      height: auto;
      border: 1px solid #eee;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
    .upload-box {
      margin-top: 16px;
      font-size: 13px;
      color: #333;
    }
    input[type="file"] {
      margin-top: 6px;
      font-size: 12px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      background-color: #00703c;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active {
      background-color: #00542d;
    }
    /* Sembunyikan wadah QR mentah */
    #hidden-qr {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>QR Code Point Coffee</h2>
    <p>Diponegoro 2 • Static & Aktif Selamanya</p>

    <!-- Wadah QR Mentah -->
    <div id="hidden-qr"></div>

    <!-- Hasil QR + Logo Resolusi Tinggi (1200x1200 px) -->
    <canvas id="finalCanvas" width="1200" height="1200"></canvas>

    <!-- Opsi pilih logo manual dari galeri jika file logo.jpg belum ada di folder -->
    <div class="upload-box">
      <label for="logoInput">Pilih gambar logo dari galeri (opsional):</label><br>
      <input type="file" id="logoInput" accept="image/*">
    </div>

    <button onclick="downloadQR()">Download PNG Siap Cetak</button>
  </div>

  <script>
    const TARGET_URL = "https://rumahdigitalproject.github.io/PointcoffeDiponegoro2/";
    const QR_SIZE = 1200; // Resolusi 1200x1200 px agar sangat tajam saat dicetak

    const hiddenQrDiv = document.getElementById("hidden-qr");
    const finalCanvas = document.getElementById("finalCanvas");
    const ctx = finalCanvas.getContext("2d");

    // 1. Generate Static QR Code mentah
    const qr = new QRCode(hiddenQrDiv, {
      text: TARGET_URL,
      width: QR_SIZE,
      height: QR_SIZE,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H // Wajib Level H agar tetap terbaca walau tertutup logo di tengah
    });

    // 2. Fungsi menggabungkan QR Code dengan Logo di tengah
    function renderQRWithLogo(logoSrc) {
      setTimeout(() => {
        const qrCanvas = hiddenQrDiv.querySelector("canvas");
        if (!qrCanvas) return;

        // Bersihkan dan gambar background putih penuh (margin aman untuk cetak)
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, QR_SIZE, QR_SIZE);

        // Gambar QR Code dengan sedikit margin tepi (quiet zone)
        const margin = 60;
        const innerSize = QR_SIZE - (margin * 2);
        ctx.drawImage(qrCanvas, margin, margin, innerSize, innerSize);

        // Jika ada logo, gambar tepat di tengah
        if (logoSrc) {
          const logoImg = new Image();
          logoImg.crossOrigin = "Anonymous";
          logoImg.onload = function() {
            // Ukuran logo ideal adalah ~22% dari total ukuran QR agar tetap aman di-scan
            const logoBoxSize = QR_SIZE * 0.22;
            const logoX = (QR_SIZE - logoBoxSize) / 2;
            const logoY = (QR_SIZE - logoBoxSize) / 2;
            const borderPadding = 16; // Bingkai putih di sekeliling logo
            const radius = 28; // Sudut melengkung

            // Gambar kotak putih melengkung sebagai background logo
            ctx.fillStyle = "#ffffff";
            drawRoundedRect(
              ctx,
              logoX - borderPadding,
              logoY - borderPadding,
              logoBoxSize + (borderPadding * 2),
              logoBoxSize + (borderPadding * 2),
              radius
            );
            ctx.fill();

            // Gambar logo di dalam kotak putih dengan sudut melengkung
            ctx.save();
            drawRoundedRect(ctx, logoX, logoY, logoBoxSize, logoBoxSize, radius - 8);
            ctx.clip();
            ctx.drawImage(logoImg, logoX, logoY, logoBoxSize, logoBoxSize);
            ctx.restore();
          };
          logoImg.onerror = function() {
            console.warn("File logo.jpg tidak ditemukan, silakan pilih manual lewat tombol upload.");
          };
          logoImg.src = logoSrc;
        }
      }, 300);
    }

    // Fungsi bantu membuat kotak dengan sudut melengkung (rounded rectangle)
    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // Muat default 'logo.jpg' saat halaman dibuka
    renderQRWithLogo("logo.jpg");

    // Jika user memilih gambar manual dari galeri HP
    document.getElementById("logoInput").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        renderQRWithLogo(event.target.result);
      };
      reader.readAsDataURL(file);
    });

    // 3. Fungsi Download PNG Resolusi Tinggi
    function downloadQR() {
      const link = document.createElement("a");
      link.download = "QR-PointCoffee-Diponegoro2-Logo.png";
      link.href = finalCanvas.toDataURL("image/png");
      link.click();
    }
  </script>

</body>
</html>
